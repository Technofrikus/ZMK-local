# Debug config for Tipper TF
# Usage:
# - Add to build: -DOVERLAY_CONFIG=keyboards/tipper_tf/tipper_tf_debug.conf
# - If you already use OVERLAY_CONFIG, append with a semicolon.
#
# NOTE: USB logging is incompatible with ZMK Studio unless you also
# switch the chosen UART in the device tree to `usb_logging_uart`.

# Verbose logging
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# USB logging (debug only)
CONFIG_ZMK_USB_LOGGING=y
