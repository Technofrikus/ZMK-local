# Planckton Configuration
#
# ZMK Studio Support (Entsperrt & Optimiert)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=4096

# Keyboard Identity
CONFIG_ZMK_KEYBOARD_NAME="Planckton"

# Encoder & Sensor Support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_KEYMAP_SENSORS=y

# USB Stack configuration (Fix für Gerätename & Studio)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Planckton"
CONFIG_USB_DEVICE_MANUFACTURER="tf"
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E

# USB/BLE Features
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Speicherung der Einstellungen (Wichtig für BT Bonds & Studio)
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Logging deaktivieren (Vermeidet CDC ACM Konflikte)
CONFIG_ZMK_USB_LOGGING=n

# Display deaktivieren (Vermeidet Konflikte mit Tipper TF)
CONFIG_ZMK_DISPLAY=n

# Batteriestandsanzeige
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep Sleep nach 30 Minuten
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
