description: GoodDisplay GDEW0154M09 EPD Controller

compatible: "gooddisplay,gdew0154m09"

include: [spi-device.yaml]

properties:
  width:
    type: int
    required: true
    description: Display width in pixels

  height:
    type: int
    required: true
    description: Display height in pixels

  reset-gpios:
    type: phandle-array
    required: true
    description: RESET signal

  dc-gpios:
    type: phandle-array
    required: true
    description: Data/Command signal

  busy-gpios:
    type: phandle-array
    required: true
    description: BUSY signal

  pwr:
    type: uint8-array
    required: false
    description: Power setting configuration
